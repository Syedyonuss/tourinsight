services:
  - type: web
    name: tourinsight-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:APP --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: TOURINSIGHT_DB
        value: /var/data/tourinsight.db
      - key: TOURINSIGHT_UPLOADS
        value: /var/data/uploads
    disk:
      name: tourinsight-data
      mountPath: /var/data
      sizeGB: 1
